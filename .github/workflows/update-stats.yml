name: Update GitHub Stats
on:
  schedule:
    - cron: '0 * * * *' # Runs hourly
  workflow_dispatch: # Allows manual trigger

jobs:
  stats:
    runs-on: ubuntu-latest
    # CRITICAL: This permission block is required to commit the file
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Generate Stats Card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=dre-garza&show_icons=true&theme=dark
          path: stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats.svg
          git commit -m "Update stats SVG" || exit 0
          git push   